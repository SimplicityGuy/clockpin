---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    assignees:
      - "SimplicityGuy"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    assignees:
      - "SimplicityGuy"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    assignees:
      - "SimplicityGuy"
    groups:
      pre-commit-security:
        applies-to: security-updates
        patterns: ["*"]
      pre-commit-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    assignees:
      - "SimplicityGuy"
    groups:
      rust-toolchain-security:
        applies-to: security-updates
        patterns: ["*"]
      rust-toolchain-version:
        applies-to: version-updates
        patterns: ["*"]
